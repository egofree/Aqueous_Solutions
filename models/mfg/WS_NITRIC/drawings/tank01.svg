<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AD - tank01: Day tank OD 400 x wall 10, z 40..320, heads, on the bund tray</text><text x="6" y="37">Graph revision AD - tank01: Volume per the duty section 2 X-SAF-09 basis; the vent goes on IA-NIT-VENT to NOX_SCRUB and overflow goes to the oxidizing-acid bund (duty section 6)</text><text x="6" y="50">Graph revision AD - tank01: Welds per the unit WORK_ORDER route (F-MACH): sheet/pipe cut, thermoplastic weld, set-in ports, leak test</text></g>
