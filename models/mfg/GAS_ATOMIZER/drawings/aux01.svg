<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AD - aux01: Four-post hold-down/guard frame pinning the 1000 x 600 x 800 envelope (40 x 40 posts, top rails); 8 slab anchors in fasteners.csv</text><text x="6" y="37">Graph revision AD - aux01: Ar recirculation loop DN32 tube runs to the compressor bay (30 bar class per A-M-177); loop runs are layout choice (W12)</text><text x="6" y="50">Graph revision AD - aux01: Compressor set and control cabinet as purchased envelopes (30 bar class, 5.5 kW nameplate); masses table-density placeholders until the maker TDS quotes (hold, W12)</text></g>
