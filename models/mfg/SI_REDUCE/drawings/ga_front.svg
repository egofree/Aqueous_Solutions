<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AD - ga_front: Keys: 1200 x 1000 x 1600 mm envelope - the node size_mm (graphite hot-face furnace (the issued sec3 selection) at the batch class); the retort under-fills the box by design (the batch class sets it)</text><text x="6" y="37">Graph revision AD - ga_front: Carbothermic silicon reduction retort per the duty section 3 lining stack (X-MAT-22; SCHACHT2004 ch. 8; CRC_SI benchmark): mild-steel casing OD 700 with alumina brick backup 60 mm and graphite hot face 40 mm (dry, M7)</text><text x="6" y="50">Graph revision AD - ga_front: Kroll-class retort idiom shared with the AQS-DUTY-072 pot-cell lineage (TI_CELL train); charge hopper on the lid (dry char + silica feed, duty section 3)</text><text x="6" y="63">Graph revision AD - ga_front: Heater band envelope, node continuous 5.0 kW (X-SPEC carbothermic study class); purchased per plan rule 6</text></g>
