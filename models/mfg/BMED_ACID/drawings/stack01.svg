<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AD - stack01: EDBM stack per the AQS-DUTY-068 / A-M-170 construction: Ti/MMO anode end plate, clamp frames, triplet laminate, 316L cathode end plate (M6), tie rods (M4)</text><text x="6" y="37">Graph revision AD - stack01: 85 triplets at 2.85 mm pitch (the A-M-171 compartment + membrane stack-up), 0.04 m2 active window per cell</text><text x="6" y="50">Graph revision AD - stack01: The sizing page books 421 triplets in 5 stacks of 85 plus 1 spare for the BMED pair; the node books no per-unit count - representative module drawn (W12)</text><text x="6" y="63">Graph revision AD - stack01: Frames PVC-U drawn per duty section 3; the construction names PP - both facts recorded (hold, W12)</text></g>
