<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AC - gd01: Rear hot-zone guard: panel frame 780 x 860 on floor posts (40 x 12) and a floor channel, anchored to the frame feet; mesh opening 748 x 832 fitted at fabrication (AQS-BLD-012 class)</text><text x="6" y="37">Graph revision AC - gd01: Static shear / stop block: pedestal to the floor (80 x 160), block head z 600..800, tool-steel knife insert at the -X face, strike bar top; knife + strike surfaces are the +X face pick at x 1500</text><text x="6" y="50">Graph revision AC - gd01: Sprue/runner shear campaign is a task 12 traveller item; no rate is claimed (params.json holds)</text><text x="6" y="63">Graph revision AC - gd01: Discharge lane guides x2 at the +X face (20 x 100 x 40 each) pick the N3/N4 mouth edges at z 600</text><text x="6" y="76">Graph revision AC - gd01: Mould-change gantry: 2 columns SHS 80 x 80 (x 260..340) to z 1500, top beam, trolley body, hook lug; SWL 250 kg manual chain hoist = purchase item named with the rating (A-MACH); no load calc claimed (params.json holds)</text><text x="6" y="89">Graph revision AC - gd01: Fixed cover over the knife zone (t6 plate + side ribs); general tolerance ISO 2768-m unless noted</text></g>
