<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AD - aux01: Four-post hold-down/guard frame pinning the 1000 x 600 x 800 envelope (40 x 40 posts, top rails); die-zone and drum guard rail, 4 posts x 3 tiers</text><text x="6" y="37">Graph revision AD - aux01: Bench bed on 4 legs (DRAW bench idiom scaled to the node box); study sections (hold, WORK_ORDER W12)</text><text x="6" y="50">Graph revision AD - aux01: Drive group and control cabinet as purchased envelopes (nameplate 1.1 kW, node stamp; plan rule 6); cabinet mass a table-density placeholder until the maker TDS quotes (hold, W12)</text></g>
