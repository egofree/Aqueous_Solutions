<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AC - in01: A-COL internals as envelope solids: support grid, two packed beds (2303 mm total PP pall rings, in-house cut per the duty), redistribution disc, liquid distributor, PP mesh demister</text><text x="6" y="37">Graph revision AC - in01: Ring count and mesh not modelled piece-wise; the node internals row is none, so the tracker records no internal solid (hold, W12)</text><text x="6" y="50">Graph revision AC - in01: Bed elevations are the layout choice - the node design gives packed height only; no stage or HTU count is claimed anywhere (A-COL)</text></g>
