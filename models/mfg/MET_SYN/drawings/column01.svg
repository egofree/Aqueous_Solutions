<g id="aqs-fab-notes" transform="translate(0,240.0)" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#000"><text x="6" y="24">Graph revision AD - column01: Glass-lined reactor column OD 150 x 600 with borosilicate lining, base/top heads and heating-jacket band OD 190 x 300 (2 L working volume, node sizing; shell dimensions study, W12)</text><text x="6" y="37">Graph revision AD - column01: Stirrer drive on the column head as a purchased-class envelope (connected set 0.2 kW from the node)</text><text x="6" y="50">Graph revision AD - column01: CA 0 mm (AQS-STD-001); duty section 3 alternative: tantalum reactor if the HCN service shows corrosion at lining pinholes (not drawn, X-MAT-22)</text></g>
