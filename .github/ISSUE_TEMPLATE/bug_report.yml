name: Tooling bug
description: The regeneration pipeline, a test, a generator, the design tool, or a CAD builder fails or gives a wrong output.
labels: ["tooling"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, from the repository root.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or the wrong output. Trim long logs to the relevant part.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and FreeCAD / CadQuery versions if CAD is involved.
