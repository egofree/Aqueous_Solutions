# AQS-SYS-TREE-001 Rev A — nested system tree over AQS-FLOW-GRAPH-001 (AC).
#
# U4a tree-of-trees, owner-confirmed decomposition 2026-10-18:
#   sector root -> train -> subsystem (where real) -> unit leaf.
# Single-parent containment; dotted ids derive from the path; cross-cutting
# concerns (headers, junctions, Q4 services) join the train they serve and
# never become shared children.  The graph stays sole authority: this file
# only partitions it, and flow_graph/system_tree.py fails loudly on drift.
schema_version: aqs-system-tree-0.1
doc_id: AQS-SYS-TREE-001
revision: A
date: "2026-10-18"
licence: CERN-OHL-S-2.0
sector_exceptions:
  EVAP_ACID_VS: WET  # graph sector WET is pre-rename DIGESTER (Rev X); tree root DIGESTER
notes: >-
  Standby trains (pot-cell, investment-casting, fluoropolymer, litho) are
  booked present in the graph with rates TBD; standby is a description here,
  not a presence.  Levels and children are derived, never hand-edited.
nodes:
