<text x="360" y="50">Stator OD 117 mm (check 112.6 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 64.23 mm; rotor OD 63.77 mm; air gap 0.23 mm</text>
<text x="360" y="82">Core length 36 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 24 slots: area 103 mm2 at fill 0.4, depth 16.1 mm, parallel tooth 4.05 mm (1.6 T)</text>
<text x="360" y="114">Yoke 8.2 mm (1.5 T)</text>
<text x="360" y="130">Winding 541 turns/phase, 135 conductors/slot, 20 AWG (0.266 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 22 die-cast Al bars 26 mm2, end ring 23 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 71, feet A 112 x B 90, holes K 7, shaft D 14 k6 x E 30</text>
<text x="360" y="178">Rated torque 1.4 N m; bearings 2 x 6202-2Z</text>
