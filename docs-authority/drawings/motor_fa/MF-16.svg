<text x="360" y="50">Stator OD 136 mm (check 135.0 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 75.26 mm; rotor OD 74.74 mm; air gap 0.26 mm</text>
<text x="360" y="82">Core length 69 mm, stacking factor 0.97</text>
