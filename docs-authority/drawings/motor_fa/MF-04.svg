<text x="360" y="50">Stator OD 293 mm (check 314.4 mm from slot + yoke: EXCEEDS, lengthen core)</text>
<text x="360" y="66">Bore 147.75 mm; rotor OD 146.25 mm; air gap 0.75 mm</text>
<text x="360" y="82">Core length 115 mm, stacking factor 0.97</text>
