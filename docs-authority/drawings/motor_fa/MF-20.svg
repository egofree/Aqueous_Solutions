<text x="360" y="50">Stator OD 190 mm (check 182.4 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 105.35 mm; rotor OD 104.65 mm; air gap 0.35 mm</text>
<text x="360" y="82">Core length 111 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 173 mm2 at fill 0.4, depth 25.0 mm, parallel tooth 4.43 mm (1.6 T)</text>
<text x="360" y="114">Yoke 13.5 mm (1.5 T)</text>
<text x="360" y="130">Winding 245 turns/phase, 41 conductors/slot, 16 AWG (1.474 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 53 mm2, end ring 60 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 112, feet A 190 x B 140, holes K 12, shaft D 28 k6 x E 60</text>
<text x="360" y="178">Rated torque 21.9 N m; bearings 2 x 6306-2Z</text>
