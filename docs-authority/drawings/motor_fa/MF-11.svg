<text x="360" y="50">Stator OD 107 mm (check 103.6 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 59.23 mm; rotor OD 58.77 mm; air gap 0.23 mm</text>
<text x="360" y="82">Core length 33 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 24 slots: area 86 mm2 at fill 0.4, depth 14.6 mm, parallel tooth 3.73 mm (1.6 T)</text>
<text x="360" y="114">Yoke 7.6 mm (1.5 T)</text>
<text x="360" y="130">Winding 650 turns/phase, 162 conductors/slot, 21 AWG (0.184 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 22 die-cast Al bars 24 mm2, end ring 21 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 63, feet A 100 x B 80, holes K 7, shaft D 11 k6 x E 23</text>
<text x="360" y="178">Rated torque 1.0 N m; bearings 2 x 6201-2Z</text>
