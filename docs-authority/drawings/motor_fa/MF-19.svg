<text x="360" y="50">Stator OD 170 mm (check 176.1 mm from slot + yoke: EXCEEDS, lengthen core)</text>
<text x="360" y="66">Bore 94.33 mm; rotor OD 93.67 mm; air gap 0.33 mm</text>
<text x="360" y="82">Core length 111 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 196 mm2 at fill 0.4, depth 28.9 mm, parallel tooth 3.96 mm (1.6 T)</text>
<text x="360" y="114">Yoke 12.1 mm (1.5 T)</text>
<text x="360" y="130">Winding 277 turns/phase, 46 conductors/slot, 16 AWG (1.474 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 45 mm2, end ring 51 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 100, feet A 160 x B 140, holes K 12, shaft D 28 k6 x E 60</text>
<text x="360" y="178">Rated torque 16.4 N m; bearings 2 x 6206-2Z</text>
