<text x="360" y="50">Stator OD 136 mm (check 131.8 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 75.25 mm; rotor OD 74.75 mm; air gap 0.25 mm</text>
<text x="360" y="82">Core length 52 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 24 slots: area 140 mm2 at fill 0.4, depth 18.6 mm, parallel tooth 4.74 mm (1.6 T)</text>
<text x="360" y="114">Yoke 9.7 mm (1.5 T)</text>
<text x="360" y="130">Winding 730 turns/phase, 182 conductors/slot, 20 AWG (0.266 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 22 die-cast Al bars 31 mm2, end ring 27 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 80, feet A 125 x B 100, holes K 10, shaft D 19 k6 x E 40</text>
<text x="360" y="178">Rated torque 3.0 N m; bearings 2 x 6204-2Z</text>
