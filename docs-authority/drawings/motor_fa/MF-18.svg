<text x="360" y="50">Stator OD 306 mm (check 283.9 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 168.49 mm; rotor OD 167.51 mm; air gap 0.49 mm</text>
<text x="360" y="82">Core length 144 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 386 mm2 at fill 0.4, depth 36.0 mm, parallel tooth 7.08 mm (1.6 T)</text>
<text x="360" y="114">Yoke 21.6 mm (1.5 T)</text>
<text x="360" y="130">Winding 118 turns/phase, 20 conductors/slot, 13 AWG (6.835 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 114 mm2, end ring 127 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 180, feet A 279 x B 241, holes K 15, shaft D 48 k6 x E 110</text>
<text x="360" y="178">Rated torque 101.2 N m; bearings 2 x 6310-2Z</text>
