<text x="360" y="50">Stator OD 95 mm (check 94.2 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 52.22 mm; rotor OD 51.78 mm; air gap 0.22 mm</text>
<text x="360" y="82">Core length 29 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 24 slots: area 77 mm2 at fill 0.4, depth 14.3 mm, parallel tooth 3.29 mm (1.6 T)</text>
<text x="360" y="114">Yoke 6.7 mm (1.5 T)</text>
<text x="360" y="130">Winding 823 turns/phase, 206 conductors/slot, 22 AWG (0.130 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 22 die-cast Al bars 21 mm2, end ring 19 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 63, feet A 100 x B 80, holes K 7, shaft D 11 k6 x E 23</text>
<text x="360" y="178">Rated torque 0.7 N m; bearings 2 x 6201-2Z</text>
