<text x="360" y="50">Stator OD 224 mm (check 202.5 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 123.39 mm; rotor OD 122.61 mm; air gap 0.39 mm</text>
<text x="360" y="82">Core length 147 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 181 mm2 at fill 0.4, depth 23.7 mm, parallel tooth 5.19 mm (1.6 T)</text>
<text x="360" y="114">Yoke 15.9 mm (1.5 T)</text>
<text x="360" y="130">Winding 157 turns/phase, 26 conductors/slot, 15 AWG (2.400 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 63 mm2, end ring 70 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 132, feet A 216 x B 178, holes K 12, shaft D 38 k6 x E 80</text>
<text x="360" y="178">Rated torque 41.0 N m; bearings 2 x 6308-2Z</text>
