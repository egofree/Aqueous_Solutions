<text x="360" y="50">Stator OD 170 mm (check 170.2 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 94.31 mm; rotor OD 93.69 mm; air gap 0.31 mm</text>
<text x="360" y="82">Core length 81 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 168 mm2 at fill 0.4, depth 25.9 mm, parallel tooth 3.96 mm (1.6 T)</text>
<text x="360" y="114">Yoke 12.1 mm (1.5 T)</text>
<text x="360" y="130">Winding 378 turns/phase, 63 conductors/slot, 17 AWG (0.927 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 46 mm2, end ring 51 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 100, feet A 160 x B 140, holes K 12, shaft D 28 k6 x E 60</text>
<text x="360" y="178">Rated torque 12.0 N m; bearings 2 x 6206-2Z</text>
