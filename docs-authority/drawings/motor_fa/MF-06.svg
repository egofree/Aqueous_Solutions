<text x="360" y="50">Stator OD 121 mm (check 119.3 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 66.24 mm; rotor OD 65.76 mm; air gap 0.24 mm</text>
<text x="360" y="82">Core length 46 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 24 slots: area 123 mm2 at fill 0.4, depth 18.0 mm, parallel tooth 4.17 mm (1.6 T)</text>
<text x="360" y="114">Yoke 8.5 mm (1.5 T)</text>
<text x="360" y="130">Winding 929 turns/phase, 232 conductors/slot, 21 AWG (0.184 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 22 die-cast Al bars 27 mm2, end ring 24 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 71, feet A 112 x B 90, holes K 7, shaft D 14 k6 x E 30</text>
<text x="360" y="178">Rated torque 2.0 N m; bearings 2 x 6202-2Z</text>
