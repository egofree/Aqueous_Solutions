<text x="360" y="50">Stator OD 129 mm (check 133.8 mm from slot + yoke: EXCEEDS, lengthen core)</text>
<text x="360" y="66">Bore 64.34 mm; rotor OD 63.66 mm; air gap 0.34 mm</text>
<text x="360" y="82">Core length 51 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 83 mm2 at fill 0.4, depth 18.4 mm, parallel tooth 2.70 mm (1.6 T)</text>
<text x="360" y="114">Yoke 16.5 mm (1.5 T)</text>
<text x="360" y="130">Winding 438 turns/phase, 73 conductors/slot, 19 AWG (0.394 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 21 mm2, end ring 46 mm2, skew 1 slot</text>
<text x="360" y="162">Frame: </text>
<text x="360" y="178">Rated torque 2.1 N m; bearings per sheet</text>
