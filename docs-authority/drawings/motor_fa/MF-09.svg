<text x="360" y="50">Stator OD 153 mm (check 149.5 mm from slot + yoke: fits)</text>
<text x="360" y="66">Bore 84.28 mm; rotor OD 83.72 mm; air gap 0.28 mm</text>
<text x="360" y="82">Core length 52 mm, stacking factor 0.97</text>
<text x="360" y="98">Stator 36 slots: area 124 mm2 at fill 0.4, depth 21.8 mm, parallel tooth 3.54 mm (1.6 T)</text>
<text x="360" y="114">Yoke 10.8 mm (1.5 T)</text>
<text x="360" y="130">Winding 657 turns/phase, 110 conductors/slot, 19 AWG (0.394 mm2) class 200 enamel</text>
<text x="360" y="146">Rotor 28 die-cast Al bars 41 mm2, end ring 46 mm2, skew 1 slot</text>
<text x="360" y="162">Frame IEC H 90, feet A 140 x B 100, holes K 10, shaft D 24 k6 x E 50</text>
<text x="360" y="178">Rated torque 6.0 N m; bearings 2 x 6205-2Z</text>
