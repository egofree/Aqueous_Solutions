<text x="24" y="793" font-size="9">Sources: AQS-PIP-004 line list; AQS-CTL-001 instrument index; AQS-INV-005 valve inventory; AQS-CTL-003 cause and effect; nozzles/GROW_BED.csv.</text>
<text x="24" y="808" font-size="9">Valves not on a unit edge (inventory basis names no incident stream): check valve DN50 (IA-RES-01: pump discharge (assumed)); check valve DN50 (IA-COMP-01: pump discharge (assumed)); check valve DN15 (IA-BED-COMP: pump discharge (assumed)); check valve DN20 (IA-BIO-BED: pump discharge (assumed)); check valve DN50 (IA-CLOSE-2: pump discharge (assumed)); check valve DN15 (IA-DR-IN: pump discharge (assumed)) ...</text>
<text x="24" y="823" font-size="9">Nozzles with no matching graph edge (service text): N8 food waste to larvae; N9 drain; N10 vent</text>
<text x="24" y="838" font-size="9">Study. Not a PE stamp. Symbols per ISA-5.1-2022 and ISO 10628-2 intent; sheet format per AQS-DWG-001.</text>
